name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.image }}, ${{ matrix.arch }})
    # Native runners per arch instead of QEMU-emulating arm64 on an amd64 box: each
    # leg builds on real hardware for its own platform, in parallel, no emulation tax.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One Dockerfile for every vehicle; the build args pick the ArduPilot
        # release, the waf target, and the image's default --vehicle/--frame.
        arch: [amd64, arm64]
        image: [copter, plane, rover, sub]
        include:
          - image: copter
            build-args: |
              GIT_TAG=Copter-4.7.1
              WAF_TARGET=copter
              SIM_VEHICLE=ArduCopter
              SIM_FRAME=+
          - image: plane
            build-args: |
              GIT_TAG=Plane-4.7.1
              WAF_TARGET=plane
              SIM_VEHICLE=ArduPlane
              SIM_FRAME=plane
          - image: rover
            build-args: |
              GIT_TAG=Rover-4.7.1
              WAF_TARGET=rover
              SIM_VEHICLE=Rover
              SIM_FRAME=rover
          - image: sub
            build-args: |
              GIT_TAG=Sub-4.7.1
              WAF_TARGET=sub
              SIM_VEHICLE=ArduSub
              SIM_FRAME=vectored
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Every event (PR or push) builds into the local daemon first so the smoke
      # test runs against exactly what would be published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sitl:test
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The SITL binary opens its MAVLink TCP server on 5760 once it's up, so a
      # listening port means the vehicle built, the entrypoint resolved and the
      # simulator actually started.
      - name: Smoke test (SITL listens on 5760)
        run: |
          docker run -d --name sitl -p 5760:5760 sitl:test
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5760) 2>/dev/null; then
              echo "SITL is listening on 5760"
              docker rm -f sitl >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' sitl)" != "true" ]; then
              echo "::error::SITL container exited early"
              break
            fi
            sleep 2
          done
          docker logs sitl
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes: push this arch alone, tagged only by digest (no human-readable tag
      # yet) - the publish job below merges both digests into one multi-arch
      # manifest under the real tags (latest, sha, semver). Fully cached from the
      # smoke-test build above, so this is just the upload.
      - name: Push by digest
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest (${{ matrix.image }})
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [copter, plane, rover, sub]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}:${{ steps.meta.outputs.version }}
