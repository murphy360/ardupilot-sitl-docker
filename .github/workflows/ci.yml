name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Daily check for a new ArduPilot stable release; builds only when one lands.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ArduPilot moves <Vehicle>-stable tags to each new stable release. Build from
  # the concrete release tag they point at (e.g. Copter-4.7.1), never the moving
  # tag itself: a changed GIT_TAG is what busts the build cache for the clone,
  # and the release number becomes an image tag.
  resolve:
    name: Resolve ArduPilot stable releases
    runs-on: ubuntu-latest
    outputs:
      copter: ${{ steps.resolve.outputs.copter }}
      plane: ${{ steps.resolve.outputs.plane }}
      rover: ${{ steps.resolve.outputs.rover }}
      sub: ${{ steps.resolve.outputs.sub }}
      changed: ${{ steps.published.outputs.changed }}
    steps:
      - name: Resolve stable tags to release tags
        id: resolve
        run: |
          refs=$(git ls-remote --tags https://github.com/ArduPilot/ardupilot.git)
          # Map every tag to the commit it points at (peeled ^{} lines win for
          # annotated tags), then pick the <prefix>-X.Y.Z tag sharing the stable
          # tag's commit.
          resolve() {
            awk -v stable="refs/tags/$1" -v pre="$2" '
              { n=$2; sub(/\^\{\}$/,"",n); sha[n]=$1 }
              END { s=sha[stable]; if (s=="") exit 1
                    re="^refs/tags/" pre "-[0-9]+\\.[0-9]+\\.[0-9]+$"
                    for (n in sha) if (sha[n]==s && n ~ re) { sub("refs/tags/","",n); print n } }
            ' <<<"$refs" | sort -V | tail -1
          }
          for spec in copter:ArduCopter-stable:Copter plane:ArduPlane-stable:Plane \
                      rover:APMrover2-stable:Rover sub:ArduSub-stable:Sub; do
            IFS=: read -r image stable prefix <<<"$spec"
            tag=$(resolve "$stable" "$prefix")
            if [ -z "$tag" ]; then
              echo "::error::Could not resolve $stable to a $prefix-X.Y.Z release tag"
              exit 1
            fi
            echo "$image: $stable -> $tag"
            echo "$image=$tag" >> "$GITHUB_OUTPUT"
          done

      # Scheduled runs skip the build when every image already has its release
      # published. Anonymous inspect works because the packages are public.
      - name: Check for unpublished releases
        id: published
        run: |
          changed=false
          for image in copter plane rover sub; do
            case $image in
              copter) tag='${{ steps.resolve.outputs.copter }}' ;;
              plane)  tag='${{ steps.resolve.outputs.plane }}' ;;
              rover)  tag='${{ steps.resolve.outputs.rover }}' ;;
              sub)    tag='${{ steps.resolve.outputs.sub }}' ;;
            esac
            ref="${{ env.REGISTRY }}/${{ github.repository }}-$image:${tag#*-}"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "$ref already published"
            else
              echo "$ref not published yet"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # The torpedo front seat (torpedo/): pure Python, no ArduPilot build. Runs on every
  # pull request and push, the unit tests and the code rules.
  torpedo:
    name: Torpedo core (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet ruff==0.6.9 pytest==8.3.3 pymavlink==2.4.50
      - name: Code rules (ruff, 88 columns)
        working-directory: torpedo
        run: |
          /tmp/venv/bin/ruff check .
          /tmp/venv/bin/ruff format --check .
      - name: Unit tests
        working-directory: torpedo
        run: /tmp/venv/bin/python -m pytest -q tests

  # The torpedo image (torpedo/Dockerfile): built per architecture on a native runner,
  # smoke tested (no hull exits 2; a hull flies to a point 300 m away at 30x), and on a
  # push to the default branch pushed by digest for the manifest below. It follows no
  # ArduPilot release, so a scheduled run does not build it.
  torpedo-image:
    name: Torpedo image (${{ matrix.arch }})
    needs: [torpedo]
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: torpedo
          file: torpedo/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: torpedo:test
          cache-from: type=gha,scope=torpedo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=torpedo-${{ matrix.arch }}

      # With no hull the image says why and exits 2.
      - name: Smoke test (no hull exits 2)
        run: |
          code=0
          docker run --rm torpedo:test || code=$?
          if [ "$code" != 2 ]; then
            echo "::error::expected exit 2 with no model, got $code"
            exit 1
          fi

      # A generic test hull at 30x: arm, GUIDED to a point 300 m away at 4 m depth,
      # and see it within the waypoint radius in under 30 s of wall time.
      - name: Smoke test (arm, GUIDED to a point 300 m away)
        run: |
          docker run -d --name torpedo -e SPEEDUP=30 \
            -e TORPEDO_MODEL=/models/torpedo-test-small.json \
            -v "$PWD/torpedo/tests/models:/models:ro" \
            -v "$PWD/torpedo/tools:/tools:ro" torpedo:test
          trap 'docker logs torpedo 2>&1 | tail -30; docker rm -f torpedo >/dev/null' EXIT
          timeout 180 docker exec torpedo python3 /tools/smoke.py

      # The motorboat holds a point without sliding off it: patches/ adds lateral
      # hull drag, which the stock model lacks (murphy360/Proteus#864, #2252).
      - name: Smoke test (a motorboat on station damps its sideslip)
        if: matrix.image == 'rover'
        run: |
          docker run -d --name hull -e MODEL=motorboat -e SPEEDUP=20 -e ALT=0 \
            -v "$PWD/tests:/tests:ro" sitl:test
          trap 'docker logs hull 2>&1 | tail -50; docker rm -f hull >/dev/null' EXIT
          timeout 600 docker exec hull python3 /tests/hull_sideslip.py --minutes 15
          trap 'docker rm -f hull >/dev/null' EXIT

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: torpedo
          file: torpedo/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-torpedo,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=torpedo-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-torpedo-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch manifest under the torpedo image's tags: latest, the commit and
  # 0.1.<run>.
  torpedo-publish:
    name: Publish multi-arch manifest (torpedo)
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: [torpedo-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-torpedo-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-torpedo
          tags: |
            type=raw,value=0.1.${{ github.run_number }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("${{ env.REGISTRY }}/${{ github.repository }}-torpedo@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository }}-torpedo:0.1.${{ github.run_number }}

  build:
    name: Build (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [resolve]
    if: github.event_name != 'schedule' || needs.resolve.outputs.changed == 'true'
    # Native runners per arch instead of QEMU-emulating arm64 on an amd64 box: each
    # leg builds on real hardware for its own platform, in parallel, no emulation tax.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One Dockerfile for every vehicle; the build args pick the ArduPilot
        # release (from the resolve job), the waf target, and the image's default
        # --vehicle/--frame.
        arch: [amd64, arm64]
        image: [copter, plane, rover, sub]
        include:
          # reloc-alt: SIM_OPOS_ALT for the relocation smoke test. Sub's water
          # surface is 0 m AMSL; the others just need a plausible ground level.
          - image: copter
            reloc-alt: 5
            build-args: |
              WAF_TARGET=copter
              SIM_VEHICLE=ArduCopter
              SIM_FRAME=+
          - image: plane
            reloc-alt: 5
            build-args: |
              WAF_TARGET=plane
              SIM_VEHICLE=ArduPlane
              SIM_FRAME=plane
          - image: rover
            reloc-alt: 5
            build-args: |
              WAF_TARGET=rover
              SIM_VEHICLE=Rover
              SIM_FRAME=rover
          - image: sub
            reloc-alt: 0
            build-args: |
              WAF_TARGET=sub
              SIM_VEHICLE=ArduSub
              SIM_FRAME=vectored
              SIM_ALT=0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Every event builds into the local daemon first so the smoke test runs
      # against exactly what would be published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            GIT_TAG=${{ needs.resolve.outputs[matrix.image] }}
            ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sitl:test
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The SITL binary opens its MAVLink TCP server on 5760 once it's up, so a
      # listening port means the vehicle built, the entrypoint resolved and the
      # simulator actually started.
      - name: Smoke test (SITL listens on 5760)
        run: |
          docker run -d --name sitl -p 5760:5760 sitl:test
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5760) 2>/dev/null; then
              echo "SITL is listening on 5760"
              docker rm -f sitl >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' sitl)" != "true" ]; then
              echo "::error::SITL container exited early"
              break
            fi
            sleep 2
          done
          docker logs sitl
          exit 1

      # What Proteus relies on: PARAM_SET SIM_OPOS_* + MAV_CMD_PREFLIGHT_REBOOT_SHUTDOWN
      # brings the vehicle back at the new location, and a container restart
      # puts it back at the env (image default) location.
      - name: Smoke test (runtime relocation over MAVLink)
        run: |
          docker run -d --name reloc -v "$PWD/tests:/tests:ro" sitl:test
          trap 'docker logs reloc 2>&1 | tail -50; docker rm -f reloc >/dev/null' EXIT
          timeout 300 docker exec reloc python3 /tests/sitl_relocate.py \
            relocate 36.6021 -121.8947 ${{ matrix.reloc-alt }} 90
          docker restart -t 5 reloc
          timeout 300 docker exec reloc python3 /tests/sitl_relocate.py \
            check 42.3898 -71.1476 270
          trap 'docker rm -f reloc >/dev/null' EXIT

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Non-PR runs: push this arch alone, tagged only by digest (no human-readable
      # tag yet) - the publish job below merges both digests into one multi-arch
      # manifest under the real tags. Fully cached from the smoke-test build
      # above, so this is just the upload.
      - name: Push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            GIT_TAG=${{ needs.resolve.outputs[matrix.image] }}
            ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest (${{ matrix.image }})
    if: github.event_name != 'pull_request'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [copter, plane, rover, sub]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tag Copter-4.7.1 -> image tags 4.7.1 and 4.7 alongside latest/sha.
      - name: ArduPilot version
        id: ap
        run: |
          tag='${{ needs.resolve.outputs[matrix.image] }}'
          version=${tag#*-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.ap.outputs.version }}
            type=raw,value=${{ steps.ap.outputs.minor }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}:${{ steps.ap.outputs.version }}
